name: Deploy to skills.sh

on:
  push:
    branches:
      - main
    paths:
      - "shotforge/**"
      - "README.md"
      - ".github/workflows/skills-sh.yml"
  pull_request:
    paths:
      - "shotforge/**"
      - "README.md"
      - ".github/workflows/skills-sh.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-sh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill package
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Show Skills CLI version
        run: npx --yes skills --version

      - name: Verify local skill discovery
        run: npx --yes skills add . --list

      - name: Smoke install from checked-out source
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/skills-local-home"
          mkdir -p "$HOME"
          npx --yes skills add . --skill shotforge --agent codex --global --copy --yes
          test -f "$HOME/.codex/skills/shotforge/SKILL.md"

      - name: Smoke install from public GitHub source
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/skills-github-home"
          mkdir -p "$HOME"
          npx --yes skills add "$GITHUB_REPOSITORY" --skill shotforge --agent codex --global --copy --yes
          test -f "$HOME/.codex/skills/shotforge/SKILL.md"

      - name: Print skills.sh details
        if: github.event_name != 'pull_request'
        run: |
          echo "Install: npx skills add $GITHUB_REPOSITORY --skill shotforge"
          echo "Directory: https://skills.sh/$GITHUB_REPOSITORY/shotforge"
